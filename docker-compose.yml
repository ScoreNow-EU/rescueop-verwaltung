services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rescueop}
      POSTGRES_USER: ${POSTGRES_USER:-rescueop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rescueop} -d ${POSTGRES_DB:-rescueop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rescueop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rescueop}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rescueop_assets:/app/assets
      - rescueop_data:/app/data

volumes:
  postgres_data:
  rescueop_assets:
  rescueop_data:
